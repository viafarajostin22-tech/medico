<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario y Pruebas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Registro de Pruebas de Laboratorio</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {% if form.non_field_errors %}
                            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                        {% endif %}

                        <div class="mb-3">
                            <label class="form-label">Nombre del Usuario:</label>
                            {{ form.nombre_usuario }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Documento:</label>
                            {{ form.documento }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Puesto de Salud:</label>
                            {{ form.puesto }}
                        </div>

                        <label class="form-label fw-bold mt-2">Seleccione las Pruebas:</label>
                        <div class="form-check">
                            {{ form.microbiologia }}
                            <label class="form-check-label">Microbiología ($15.000)</label>
                        </div>
                        <div class="form-check">
                            {{ form.bacteriologia }}
                            <label class="form-check-label">Bacteriología ($25.000)</label>
                        </div>
                        <div class="form-check">
                            {{ form.quimica }}
                            <label class="form-check-label">Química ($35.000)</label>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'lista_equipos' %}" class="btn btn-secondary">Ver Estadísticas</a>
                            <button type="submit" class="btn btn-success">Guardar y Calcular</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
